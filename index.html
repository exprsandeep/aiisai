<!DOCTYPE html>
<html>
<head>
  <title>Dino Game</title>

  <style>
    body {
      margin: 0;
      background-color: skyblue;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #gameCanvas {
      background: white;
      border-top: 4px solid black;
      display: none;
      margin: 0 auto;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 22px;
      margin: 10px;
      cursor: pointer;
    }

    #restartBtn {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Dino Jump Game</h1>

  <button id="playBtn">Play</button>

  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="resumeBtn">Resume</button>
    <button id="jumpBtn">Jump</button>
    <button id="restartBtn">Restart</button>
  </div>

  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const playBtn =
      document.getElementById("playBtn");

    const restartBtn =
      document.getElementById("restartBtn");

    const pauseBtn =
      document.getElementById("pauseBtn");

    const resumeBtn =
      document.getElementById("resumeBtn");

    const jumpBtn =
      document.getElementById("jumpBtn");

    const canvas =
      document.getElementById("gameCanvas");

    const ctx =
      canvas.getContext("2d");


    /* =========================
       CANVAS
    ========================= */

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height = 300;
    }

    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================
       DINO IMAGE
    ========================= */

    const dinoImg = new Image();

    /*
      dino.png should be in the
      same folder as this HTML file.
    */

    dinoImg.src = "dino.png";


    /* =========================
       GAME VARIABLES
    ========================= */

    let dino;

    let obstacles = [];

    let speed = 8;

    let score = 0;

    let gameOver = false;

    let paused = false;

    let animationFrame = null;


    /* =========================
       HIGH SCORE
    ========================= */

    let highScore =
      Number(
        localStorage.getItem(
          "dinoHighScore"
        )
      ) || 0;


    /* =========================
       GAME SETTINGS
    ========================= */

    const gravity = 1;

    const jumpPower = 16;

    const groundY = 230;


    /*
      Faster starting speed.
    */

    const startingSpeed = 8;


    /*
      Slowly gets faster forever.
    */

    const speedIncrease = 0.002;


    /* =========================
       OBSTACLE SPAWNING
    ========================= */

    let obstacleTimer = 0;

    let nextObstacleTime = 1200;


    /* =========================
       START / RESET GAME
    ========================= */

    function init() {

      dino = {

        x: 60,

        y: groundY,

        width: 60,

        height: 60,

        dy: 0,

        jumping: false
      };


      obstacles = [];


      speed =
        startingSpeed;


      score = 0;


      gameOver = false;


      paused = false;


      obstacleTimer = 0;


      nextObstacleTime =
        1000 +
        Math.random() * 700;
    }


    /* =========================
       JUMP
    ========================= */

    function jump() {

      if (
        !dino.jumping &&
        !gameOver &&
        !paused
      ) {

        dino.jumping = true;

        dino.dy =
          -jumpPower;
      }
    }


    /* =========================
       CREATE OBSTACLE
    ========================= */

    function createObstacle() {

      const height =
        35 +
        Math.random() * 25;


      const width =
        25 +
        Math.random() * 20;


      obstacles.push({

        x:
          canvas.width +
          10,

        y:
          groundY +
          dino.height -
          height,

        width:
          width,

        height:
          height

      });
    }


    /* =========================
       UPDATE GAME
    ========================= */

    function update() {

      if (
        paused ||
        gameOver
      ) {

        return;
      }


      /* =====================
         SCORE
      ===================== */

      score++;


      /* =====================
         SPEED
      ===================== */

      /*
        Keeps increasing forever.
      */

      speed +=
        speedIncrease;


      /* =====================
         JUMP PHYSICS
      ===================== */

      if (dino.jumping) {

        dino.y +=
          dino.dy;


        dino.dy +=
          gravity;


        if (
          dino.y >=
          groundY
        ) {

          dino.y =
            groundY;


          dino.dy = 0;


          dino.jumping =
            false;
        }
      }


      /* =====================
         OBSTACLE TIMER
      ===================== */

      obstacleTimer++;


      if (
        obstacleTimer >=
        nextObstacleTime / 16
      ) {

        createObstacle();


        obstacleTimer = 0;


        /*
          Obstacles gradually become
          a little closer together as
          the speed increases.
        */

        nextObstacleTime =
          Math.max(

            650,

            1350 -
            (speed - startingSpeed) * 30 +
            Math.random() * 650

          );
      }


      /* =====================
         MOVE OBSTACLES
      ===================== */

      for (
        let obstacle
        of obstacles
      ) {

        obstacle.x -=
          speed;
      }


      obstacles =
        obstacles.filter(

          obstacle =>
          obstacle.x +
          obstacle.width >
          -50

        );


      /* =====================
         COLLISION
      ===================== */

      for (
        let obstacle
        of obstacles
      ) {

        /*
          Slightly smaller hitbox
          than the visible image.
        */

        const dinoLeft =
          dino.x + 8;


        const dinoRight =
          dino.x +
          dino.width -
          8;


        const dinoTop =
          dino.y + 8;


        const dinoBottom =
          dino.y +
          dino.height -
          4;


        if (

          dinoLeft <
          obstacle.x +
          obstacle.width &&

          dinoRight >
          obstacle.x &&

          dinoTop <
          obstacle.y +
          obstacle.height &&

          dinoBottom >
          obstacle.y

        ) {

          endGame();

          return;
        }
      }
    }


    /* =========================
       DRAW GAME
    ========================= */

    function draw() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* =====================
         GROUND LINE
      ===================== */

      ctx.strokeStyle =
        "#333";


      ctx.lineWidth = 2;


      ctx.beginPath();


      ctx.moveTo(
        0,
        groundY +
        dino.height
      );


      ctx.lineTo(
        canvas.width,
        groundY +
        dino.height
      );


      ctx.stroke();


      /* =====================
         DINO
      ===================== */

      ctx.drawImage(

        dinoImg,

        dino.x,

        dino.y,

        dino.width,

        dino.height

      );


      /* =====================
         RED OBSTACLES
      ===================== */

      ctx.fillStyle =
        "red";


      for (
        let obstacle
        of obstacles
      ) {

        ctx.fillRect(

          obstacle.x,

          obstacle.y,

          obstacle.width,

          obstacle.height

        );
      }


      /* =====================
         CHROME-STYLE SCORE
      ===================== */

      ctx.fillStyle =
        "#555";


      ctx.font =
        "bold 20px monospace";


      ctx.textAlign =
        "right";


      const currentScore =
        String(
          Math.floor(score)
        )
        .padStart(
          5,
          "0"
        );


      const bestScore =
        String(
          Math.floor(highScore)
        )
        .padStart(
          5,
          "0"
        );


      /*
        Example:

        HI 00997 00235
      */

      ctx.fillText(

        "HI " +
        bestScore +
        "  " +
        currentScore,

        canvas.width - 20,

        30

      );


      ctx.textAlign =
        "left";


      /* =====================
         GAME OVER
      ===================== */

      if (gameOver) {

        ctx.fillStyle =
          "#555";


        ctx.font =
          "bold 36px Arial";


        ctx.textAlign =
          "center";


        ctx.fillText(

          "GAME OVER",

          canvas.width / 2,

          130

        );


        ctx.font =
          "20px Arial";


        ctx.fillText(

          "Score: " +
          Math.floor(score),

          canvas.width / 2,

          165

        );


        ctx.textAlign =
          "left";
      }
    }


    /* =========================
       GAME LOOP
    ========================= */

    function loop() {

      update();

      draw();


      if (
        !gameOver &&
        !paused
      ) {

        animationFrame =
          requestAnimationFrame(
            loop
          );
      }
    }


    /* =========================
       END GAME
    ========================= */

    function endGame() {

      gameOver = true;


      if (
        score >
        highScore
      ) {

        highScore =
          Math.floor(score);


        localStorage.setItem(

          "dinoHighScore",

          highScore

        );
      }


      restartBtn.style.display =
        "inline-block";
    }


    /* =========================
       SPACEBAR JUMP
    ========================= */

    document.addEventListener(
      "keydown",
      function(e) {

        if (
          e.code === "Space"
        ) {

          e.preventDefault();

          jump();
        }
      }
    );


    /* =========================
       JUMP BUTTON
    ========================= */

    jumpBtn.addEventListener(
      "click",
      jump
    );


    /* =========================
       PAUSE
    ========================= */

    pauseBtn.addEventListener(
      "click",
      function() {

        if (
          gameOver ||
          paused
        ) {

          return;
        }


        paused = true;


        cancelAnimationFrame(
          animationFrame
        );
      }
    );


    /* =========================
       RESUME
    ========================= */

    resumeBtn.addEventListener(
      "click",
      function() {

        if (
          gameOver ||
          !paused
        ) {

          return;
        }


        paused = false;


        animationFrame =
          requestAnimationFrame(
            loop
          );
      }
    );


    /* =========================
       PLAY
    ========================= */

    playBtn.addEventListener(
      "click",
      function() {

        playBtn.style.display =
          "none";


        canvas.style.display =
          "block";


        restartBtn.style.display =
          "none";


        init();


        animationFrame =
          requestAnimationFrame(
            loop
          );
      }
    );


    /* =========================
       RESTART
    ========================= */

    restartBtn.addEventListener(
      "click",
      function() {

        restartBtn.style.display =
          "none";


        cancelAnimationFrame(
          animationFrame
        );


        init();


        animationFrame =
          requestAnimationFrame(
            loop
          );
      }
    );

  </script>

</body>
</html>

<script>

/* =========================================================
   TAB SWITCHING SYSTEM

   DON'T NEED TO CHANGE THIS
========================================================= */

function openGame(gameId, button) {

  const tabs =
    document.querySelectorAll(".gameTab");

  const buttons =
    document.querySelectorAll(".tabButton");


  tabs.forEach(function(tab) {
    tab.classList.remove("active");
  });


  buttons.forEach(function(btn) {
    btn.classList.remove("active");
  });


  document
    .getElementById(gameId)
    .classList
    .add("active");


  button.classList.add("active");
}
