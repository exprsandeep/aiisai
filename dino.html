```html
<!DOCTYPE html>
<html>
<head>
  <title>Dino Game</title>

  <style>
    body {
      margin: 0;
      background-color: skyblue;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #gameCanvas {
      background: white;
      border-top: 4px solid black;
      display: none;
      margin: 0 auto;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 22px;
      margin: 10px;
      cursor: pointer;
    }

    #restartBtn {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Dino Jump Game</h1>

  <button id="playBtn">Play</button>

  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="resumeBtn">Resume</button>
    <button id="jumpBtn">Jump</button>
    <button id="restartBtn">Restart</button>
  </div>

  <script>

    const playBtn = document.getElementById("playBtn");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const jumpBtn = document.getElementById("jumpBtn");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = 300;


    /* =========================
       DINO IMAGE
    ========================= */

    const dinoImg = new Image();

    /*
      Put dino.png in the same
      folder as this HTML file.
    */

    dinoImg.src = "dino.png";


    /* =========================
       GAME VARIABLES
    ========================= */

    let dino;
    let obstacles;
    let speed;
    let score;
    let gameOver;

    let paused = false;
    let animationFrame;

    let obstacleTimer = 0;
    let nextObstacleTime = 1400;


    /* =========================
       HIGH SCORE
    ========================= */

    let highScore =
      Number(
        localStorage.getItem("dinoHighScore")
      ) || 0;


    /* =========================
       SETTINGS
    ========================= */

    const gravity = 1;

    const jumpPower = 16;

    const groundY = 230;

    /*
      Starting speed.
    */
    const startingSpeed = 5;

    /*
      It slowly gets faster forever.
    */
    const speedIncrease = 0.0015;


    /* =========================
       START / RESET
    ========================= */

    function init() {

      dino = {
        x: 50,
        y: groundY,
        width: 60,
        height: 60,
        dy: 0,
        jumping: false
      };

      obstacles = [];

      speed = startingSpeed;

      score = 0;

      gameOver = false;

      paused = false;

      obstacleTimer = 0;

      nextObstacleTime =
        1200 +
        Math.random() * 900;
    }


    /* =========================
       JUMP
    ========================= */

    function jump() {

      if (
        !dino.jumping &&
        !gameOver &&
        !paused
      ) {

        dino.jumping = true;

        dino.dy = -jumpPower;
      }

    }


    /* =========================
       CREATE OBSTACLE
    ========================= */

    function createObstacle() {

      const height =
        35 +
        Math.random() * 20;

      const width =
        25 +
        Math.random() * 20;


      obstacles.push({

        x: canvas.width,

        y:
          groundY +
          dino.height -
          height,

        width: width,

        height: height

      });

    }


    /* =========================
       UPDATE
    ========================= */

    function update() {

      if (
        paused ||
        gameOver
      ) {
        return;
      }


      /* =====================
         SCORE
      ===================== */

      /*
        Chrome-style:
        score keeps ticking upward.
      */

      score++;


      /* =====================
         SPEED
      ===================== */

      /*
        Slowly and continuously
        get faster.
      */

      speed += speedIncrease;


      /* =====================
         JUMP PHYSICS
      ===================== */

      if (dino.jumping) {

        dino.y += dino.dy;

        dino.dy += gravity;


        if (
          dino.y >= groundY
        ) {

          dino.y = groundY;

          dino.dy = 0;

          dino.jumping = false;
        }

      }


      /* =====================
         OBSTACLE TIMER
      ===================== */

      obstacleTimer++;


      if (
        obstacleTimer >=
        nextObstacleTime / 16
      ) {

        createObstacle();

        obstacleTimer = 0;


        /*
          As the game gets faster,
          obstacle spacing slowly
          gets a little tighter.
        */

        nextObstacleTime =
          Math.max(

            700,

            1500 -
            (speed - startingSpeed) * 35 +
            Math.random() * 700

          );

      }


      /* =====================
         MOVE OBSTACLES
      ===================== */

      for (let o of obstacles) {

        o.x -= speed;

      }


      obstacles =
        obstacles.filter(

          o =>
          o.x +
          o.width >
          0

        );


      /* =====================
         COLLISION
      ===================== */

      for (let o of obstacles) {

        /*
          Slightly smaller Dino hitbox
          makes jumps feel fairer.
        */

        const dinoLeft =
          dino.x + 8;

        const dinoRight =
          dino.x +
          dino.width - 8;

        const dinoTop =
          dino.y + 7;

        const dinoBottom =
          dino.y +
          dino.height - 4;


        if (

          dinoLeft <
          o.x + o.width &&

          dinoRight >
          o.x &&

          dinoTop <
          o.y + o.height &&

          dinoBottom >
          o.y

        ) {

          endGame();

          return;
        }

      }

    }


    /* =========================
       DRAW
    ========================= */

    function draw() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* =====================
         GROUND
      ===================== */

      ctx.strokeStyle = "#555";

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.moveTo(
        0,
        groundY + dino.height
      );

      ctx.lineTo(
        canvas.width,
        groundY + dino.height
      );

      ctx.stroke();


      /* =====================
         DINO
      ===================== */

      ctx.drawImage(

        dinoImg,

        dino.x,

        dino.y,

        dino.width,

        dino.height

      );


      /* =====================
         OBSTACLES
      ===================== */

      ctx.fillStyle = "#555";


      for (let o of obstacles) {

        ctx.fillRect(

          o.x,

          o.y,

          o.width,

          o.height

        );

      }


      /* =====================
         CHROME STYLE SCORE
      ===================== */

      ctx.fillStyle = "#555";

      ctx.font =
        "bold 20px monospace";

      ctx.textAlign = "right";


      const currentScore =
        String(score)
          .padStart(5, "0");


      const bestScore =
        String(highScore)
          .padStart(5, "0");


      /*
        Looks like:

        HI 00452 00127
      */

      ctx.fillText(

        "HI " +
        bestScore +
        "  " +
        currentScore,

        canvas.width - 20,

        30

      );


      ctx.textAlign = "left";


      /* =====================
         GAME OVER
      ===================== */

      if (gameOver) {

        ctx.fillStyle = "#555";

        ctx.font =
          "bold 36px Arial";

        ctx.textAlign = "center";


        ctx.fillText(

          "GAME OVER",

          canvas.width / 2,

          130

        );


        ctx.textAlign = "left";

      }

    }


    /* =========================
       MAIN GAME LOOP
    ========================= */

    function loop() {

      update();

      draw();


      if (!gameOver && !paused) {

        animationFrame =
          requestAnimationFrame(loop);

      }

    }


    /* =========================
       END GAME
    ========================= */

    function endGame() {

      gameOver = true;


      if (
        score >
        highScore
      ) {

        highScore = score;

        localStorage.setItem(
          "dinoHighScore",
          highScore
        );

      }


      restartBtn.style.display =
        "inline-block";

    }


    /* =========================
       SPACEBAR
    ========================= */

    document.addEventListener(
      "keydown",
      function(e) {

        if (
          e.code === "Space"
        ) {

          e.preventDefault();

          jump();

        }

      }
    );


    /* =========================
       JUMP BUTTON
    ========================= */

    jumpBtn.addEventListener(
      "click",
      jump
    );


    /* =========================
       PAUSE
    ========================= */

    pauseBtn.addEventListener(
      "click",
      function() {

        if (
          gameOver ||
          paused
        ) {
          return;
        }


        paused = true;

        cancelAnimationFrame(
          animationFrame
        );

      }
    );


    /* =========================
       RESUME
    ========================= */

    resumeBtn.addEventListener(
      "click",
      function() {

        if (
          gameOver ||
          !paused
        ) {
          return;
        }


        paused = false;

        loop();

      }
    );


    /* =========================
       PLAY
    ========================= */

    playBtn.addEventListener(
      "click",
      function() {

        playBtn.style.display =
          "none";

        canvas.style.display =
          "block";

        restartBtn.style.display =
          "none";


        init();

        loop();

      }
    );


    /* =========================
       RESTART
    ========================= */

    restartBtn.addEventListener(
      "click",
      function() {

        restartBtn.style.display =
          "none";


        cancelAnimationFrame(
          animationFrame
        );


        init();

        loop();

      }
    );

  </script>

</body>
</html>
