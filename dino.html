<!DOCTYPE html>
<html>
<head>
  <title>Dino Game</title>
  <style>
    body {
      margin: 0;
      background-color: skyblue;
      overflow: hidden;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      display: none;
      background: white;
      border-top: 4px solid black;
    }
    #playBtn, #restartBtn, #pauseBtn, #resumeBtn, #jumpBtn {
      padding: 15px 30px;
      font-size: 22px;
      margin: 10px;
      cursor: pointer;
    }
    #restartBtn, #pauseBtn, #resumeBtn, #jumpBtn {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Dino Jump Game</h1>

  <button id="playBtn">Play</button>
  <button id="restartBtn">Restart</button>
  <button id="pauseBtn">Pause</button>
  <button id="resumeBtn">Resume</button>
  <button id="jumpBtn">Jump</button>

  <canvas id="gameCanvas"></canvas>

  <script>
    const playBtn = document.getElementById("playBtn");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const jumpBtn = document.getElementById("jumpBtn");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = 300;

    let dino, obstacles, speed, gameOver, score;
    let paused = false;
    let animationFrame;

    // Load Chrome Dino sprite
    const dinoImg = new Image();
    dinoImg.src = "https://i.imgur.com/4LGAZ8t.png";

    function init() {
      dino = { x:50, y:250, width:60, height:60, dy:0, jumping:false };
      obstacles = [];
      speed = 5;
      gameOver = false;
      score = 0;
      paused = false;
    }

    function drawDino() {
      ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
    }

    function drawObstacles() {
      ctx.fillStyle = "brown";
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
    }

    function drawScore() {
      ctx.fillStyle = "black";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 20, 30);
    }

    function update() {
      if (paused) return;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawDino();
      drawObstacles();
      drawScore();

      // gravity
      if (dino.jumping) {
        dino.y += dino.dy;
        dino.dy += 1;
        if (dino.y >= 250) {
          dino.y = 250;
          dino.jumping = false;
          dino.dy = 0;
        }
      }

      // move obstacles
      obstacles.forEach(o => o.x -= speed);

      // remove off-screen obstacles
      obstacles = obstacles.filter(o => o.x + o.width > 0);

      // collision detection
      obstacles.forEach(o => {
        if (dino.x < o.x + o.width &&
            dino.x + dino.width > o.x &&
            dino.y < o.y + o.height &&
            dino.y + dino.height > o.y) {
          gameOver = true;
        }
      });

      if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", canvas.width/2 - 100, 150);
        restartBtn.style.display = "inline-block";
        return;
      }

      // increase score
      score++;

      // gradually increase speed
      speed = Math.min(speed + 0.002, 15);

      animationFrame = requestAnimationFrame(update);
    }

    function spawnObstacle() {
      if (!gameOver) {
        const height = 40;
        const lastObstacle = obstacles[obstacles.length - 1];

        if (!lastObstacle || lastObstacle.x < canvas.width - 200) {
          obstacles.push({ x: canvas.width, y: 260, width:30, height:height });
        }

        setTimeout(spawnObstacle, 2000 + Math.random()*2000);
      }
    }

    // Keyboard jump
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && !dino.jumping && !gameOver) {
        dino.jumping = true;
        dino.dy = -15;
      }
    });

    // Mobile jump button
    jumpBtn.addEventListener("click", () => {
      if (!dino.jumping && !gameOver) {
        dino.jumping = true;
        dino.dy = -15;
      }
    });

    // Pause
    pauseBtn.addEventListener("click", () => {
      paused = true;
      cancelAnimationFrame(animationFrame);
    });

    // Resume
    resumeBtn.addEventListener("click", () => {
      if (paused && !gameOver) {
        paused = false;
        update();
      }
    });

    // Play button
    playBtn.addEventListener("click", () => {
      playBtn.style.display = "none";
      canvas.style.display = "block";

      pauseBtn.style.display = "inline-block";
      resumeBtn.style.display = "inline-block";
      jumpBtn.style.display = "inline-block";

      init();
      update();
      spawnObstacle();
    });

    // Restart button
    restartBtn.addEventListener("click", () => {
      restartBtn.style.display = "none";
      init();
      update();
      spawnObstacle();
    });
  </script>
</body>
</html>
