<!DOCTYPE html>
<html>
<head>
  <title>Platformer Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEFA; /* sky */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* PLAYER */
let player = {
  x: 100,
  y: 0,
  w: 40,
  h: 60,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 15,
  grounded: false
};

/* GRAVITY */
const gravity = 0.8;

/* PLATFORMS */
const platforms = [
  { x: 0, y: canvas.height - 40, w: 2000, h: 40 }, // ground
  { x: 300, y: canvas.height - 150, w: 200, h: 20 },
  { x: 600, y: canvas.height - 250, w: 200, h: 20 },
  { x: 900, y: canvas.height - 350, w: 200, h: 20 }
];

/* KEYS */
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* CAMERA */
let cameraX = 0;

function update() {
  /* MOVEMENT */
  if (keys["ArrowRight"]) player.vx = player.speed;
  else if (keys["ArrowLeft"]) player.vx = -player.speed;
  else player.vx = 0;

  /* JUMP */
  if (keys[" "] && player.grounded) {
    player.vy = -player.jumpPower;
    player.grounded = false;
  }

  /* APPLY GRAVITY */
  player.vy += gravity;

  /* APPLY VELOCITY */
  player.x += player.vx;
  player.y += player.vy;

  /* COLLISION */
  player.grounded = false;
  for (let p of platforms) {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y + player.h > p.y &&
      player.y + player.h < p.y + p.h &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* CAMERA FOLLOWS PLAYER */
  cameraX = player.x - canvas.width / 2;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* SKY */
  ctx.fillStyle = "#87CEFA";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* DRAW PLATFORMS */
  ctx.fillStyle = "#654321";
  for (let p of platforms) {
    ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
  }

  /* DRAW PLAYER */
  ctx.fillStyle = "red";
  ctx.fillRect(player.x - cameraX, player.y, player.w, player.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
