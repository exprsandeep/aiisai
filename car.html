<!DOCTYPE html>
<html>
<head>
  <title>Platformer Survival Game</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEFA;
      font-family: Arial;
    }

    #startScreen,
    #gameOverScreen {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      z-index: 10;
      display: none;
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    #countdown {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      color: white;
      z-index: 10;
      display: none;
    }
  </style>
</head>

<body>

<div id="startScreen">
  <h1>Platformer Survival</h1>
  <button id="playBtn">Play</button>
</div>

<div id="countdown">3</div>

<div id="gameOverScreen">
  <h1>Game Over</h1>
  <h2 id="finalScore">Score: 0</h2>
  <h3 id="finalHighScore">High Score: 0</h3>
  <button id="restartBtn">Restart</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =========================
   GAME STATE
========================= */

let gameStarted = false;
let gameOver = false;


/* =========================
   SCORE
========================= */

let score = 0;

let highScore =
  Number(localStorage.getItem("platformerHighScore")) || 0;


/* =========================
   DIFFICULTY
========================= */

let difficulty = 8;

let nextDifficultyScore = 1000;

/*
  Damage per enemy touch.
*/
let enemyDamage = 1;


/* =========================
   HIT / INVINCIBILITY
========================= */

let invincible = false;

const invincibleTime = 600;

/*
  Used for one quick flash.
*/
let hitFlash = false;


/* =========================
   PLAYER
========================= */

let player = {
  x: 100,
  y: canvas.height - 100,

  w: 40,
  h: 60,

  vx: 0,
  vy: 0,

  speed: 5,
  jumpPower: 15,

  grounded: false,

  health: 100
};


/* =========================
   PHYSICS
========================= */

const gravity = 0.8;


/* =========================
   GAME SPEED
========================= */

let scrollSpeed = 5;

let speedIncrease = 0.0003;


/* =========================
   WORLD
========================= */

let floorSegments = [];
let platforms = [];
let enemies = [];
let coins = [];

const chunkWidth = 200;

let nextChunkX = 0;

const generateDistance = 3000;
const deleteDistance = 1200;


/* =========================
   WORLD GENERATOR
========================= */

function generateChunk(x) {

  let gapChance =
    Math.min(
      0.15 + difficulty * 0.008,
      0.28
    );

  let gap = false;


  if (x > 800) {
    gap = Math.random() < gapChance;
  }


  /* =====================
     FLOOR
  ===================== */

  if (!gap) {

    floorSegments.push({
      x: x,
      y: canvas.height - 40,
      w: chunkWidth,
      h: 40
    });

  } else {

    platforms.push({
      x: x + 20,
      y: canvas.height - 150,

      w: 160,
      h: 20,

      moving:
        difficulty >= 3 &&
        Math.random() <
        Math.min(
          0.10 + difficulty * 0.02,
          0.4
        ),

      dir: 1,

      startX: x + 20
    });

  }


  /* =====================
     EXTRA PLATFORM
  ===================== */

  if (Math.random() < 0.35) {

    const px = x + 30;

    platforms.push({

      x: px,

      y:
        canvas.height -
        (Math.random() * 200 + 140),

      w: 140,
      h: 20,

      moving:
        Math.random() <
        Math.min(
          0.10 + difficulty * 0.015,
          0.35
        ),

      dir: 1,

      startX: px

    });

  }


  /* =====================
     ENEMY CHANCE
  ===================== */

  let enemyChance =
    Math.min(
      0.22 + difficulty * 0.035,
      0.70
    );


  if (
    !gap &&
    Math.random() < enemyChance
  ) {

    enemies.push({

      x: x + 100,

      y: canvas.height - 80,

      w: 40,
      h: 40,

      dir:
        Math.random() < 0.5
        ? 1
        : -1,

      speed:
        1.2 +
        difficulty * 0.12

    });

  }


  /* =====================
     EXTRA ENEMY
  ===================== */

  if (
    difficulty >= 5 &&
    !gap &&
    Math.random() <
      Math.min(
        (difficulty - 4) * 0.04,
        0.30
      )
  ) {

    enemies.push({

      x: x + 40,

      y: canvas.height - 80,

      w: 40,
      h: 40,

      dir: 1,

      speed:
        1.5 +
        difficulty * 0.12

    });

  }


  /* =====================
     COINS
  ===================== */

  if (Math.random() < 0.5) {

    coins.push({

      x: x + 100,

      y:
        canvas.height -
        (Math.random() * 180 + 100),

      w: 20,
      h: 20,

      collected: false

    });

  }

}


/* =========================
   STARTING WORLD
========================= */

for (let i = 0; i < 20; i++) {

  generateChunk(nextChunkX);

  nextChunkX += chunkWidth;

}


/* =========================
   CONTROLS
========================= */

let keys = {};

document.addEventListener(
  "keydown",
  function(e) {

    keys[e.key] = true;

    if (e.key === " ") {
      e.preventDefault();
    }

  }
);


document.addEventListener(
  "keyup",
  function(e) {

    keys[e.key] = false;

  }
);


/* =========================
   START SCREEN
========================= */

const startScreen =
  document.getElementById("startScreen");

const countdown =
  document.getElementById("countdown");

const gameOverScreen =
  document.getElementById("gameOverScreen");


startScreen.style.display = "block";


document.getElementById("playBtn").onclick =
function() {

  startScreen.style.display = "none";

  startCountdown();

};


/* =========================
   COUNTDOWN
========================= */

function startCountdown() {

  let count = 3;

  countdown.style.display = "block";
  countdown.innerText = count;


  const timer = setInterval(
    function() {

      count--;

      if (count > 0) {

        countdown.innerText = count;

      } else {

        clearInterval(timer);

        countdown.style.display =
          "none";

        gameStarted = true;

      }

    },
    1000
  );

}


/* =========================
   RESTART
========================= */

document.getElementById(
  "restartBtn"
).onclick =
function() {

  location.reload();

};


/* =========================
   DIFFICULTY INCREASE
========================= */

function increaseDifficulty() {

  difficulty++;


  /*
    Faster every level.
  */

  scrollSpeed += 0.35;


  /*
    Damage increases by 0.5
    every level.

    Maximum = 20 health.
  */

  enemyDamage = Math.min(

    1 +
    (difficulty - 8) * 0.5,

    20

  );


  nextDifficultyScore += 1000;

}


/* =========================
   PLAYER HIT
========================= */

function damagePlayer() {

  if (invincible) {
    return;
  }


  player.health -= enemyDamage;


  /*
    One quick flash.
  */

  hitFlash = true;


  setTimeout(function() {

    hitFlash = false;

  }, 120);


  /*
    Prevent repeated damage while
    still touching the enemy.
  */

  invincible = true;


  setTimeout(function() {

    invincible = false;

  }, invincibleTime);

}


/* =========================
   UPDATE
========================= */

function update() {

  if (!gameStarted || gameOver) {
    return;
  }


  /* =====================
     SCORE
  ===================== */

  score += 1;


  if (score >= nextDifficultyScore) {

    increaseDifficulty();

  }


  /* =====================
     ENDLESS WORLD
  ===================== */

  while (
    nextChunkX <
    player.x + generateDistance
  ) {

    generateChunk(nextChunkX);

    nextChunkX += chunkWidth;

  }


  /* =====================
     DELETE OLD OBJECTS
  ===================== */

  floorSegments =
    floorSegments.filter(
      f =>
      f.x + f.w >
      player.x - deleteDistance
    );


  platforms =
    platforms.filter(
      p =>
      p.x + p.w >
      player.x - deleteDistance
    );


  enemies =
    enemies.filter(
      e =>
      e.x + e.w >
      player.x - deleteDistance
    );


  coins =
    coins.filter(
      c =>
      c.x + c.w >
      player.x - deleteDistance
    );


  /* =====================
     SPEED
  ===================== */

  scrollSpeed += speedIncrease;

  player.x += scrollSpeed;


  /* =====================
     LEFT / RIGHT
  ===================== */

  if (keys["ArrowRight"]) {

    player.vx = player.speed;

  } else if (keys["ArrowLeft"]) {

    player.vx = -player.speed;

  } else {

    player.vx = 0;

  }


  /* =====================
     JUMP
  ===================== */

  if (
    keys[" "] &&
    player.grounded
  ) {

    player.vy =
      -player.jumpPower;

    player.grounded = false;

  }


  /* =====================
     GRAVITY
  ===================== */

  player.vy += gravity;


  /* =====================
     MOVE PLAYER
  ===================== */

  player.x += player.vx;

  player.y += player.vy;


  /* =====================
     FLOOR COLLISION
  ===================== */

  player.grounded = false;


  for (let f of floorSegments) {

    if (

      player.x + player.w >
      f.x &&

      player.x <
      f.x + f.w &&

      player.y + player.h >=
      f.y &&

      player.y + player.h <=
      f.y + 25 &&

      player.vy >= 0

    ) {

      player.y =
        f.y - player.h;

      player.vy = 0;

      player.grounded = true;

    }

  }


  /* =====================
     PLATFORM COLLISION
  ===================== */

  for (let p of platforms) {

    if (p.moving) {

      const platformSpeed =
        1.5 +
        difficulty * 0.08;

      p.x +=
        p.dir *
        platformSpeed;


      if (
        p.x <
        p.startX - 60
      ) {

        p.dir = 1;

      }


      if (
        p.x >
        p.startX + 60
      ) {

        p.dir = -1;

      }

    }


    if (

      player.x + player.w >
      p.x &&

      player.x <
      p.x + p.w &&

      player.y + player.h >=
      p.y &&

      player.y + player.h <=
      p.y + 25 &&

      player.vy >= 0

    ) {

      player.y =
        p.y - player.h;

      player.vy = 0;

      player.grounded = true;

    }

  }


  /* =====================
     ENEMIES
  ===================== */

  for (let e of enemies) {

    e.x +=
      e.dir * e.speed;


    if (
      Math.random() <
      0.005
    ) {

      e.dir *= -1;

    }


    if (

      player.x <
      e.x + e.w &&

      player.x + player.w >
      e.x &&

      player.y <
      e.y + e.h &&

      player.y + player.h >
      e.y

    ) {

      damagePlayer();

    }

  }


  /* =====================
     COINS
  ===================== */

  for (let c of coins) {

    if (c.collected) {
      continue;
    }


    if (

      player.x <
      c.x + c.w &&

      player.x + player.w >
      c.x &&

      player.y <
      c.y + c.h &&

      player.y + player.h >
      c.y

    ) {

      c.collected = true;


      /*
        Heal 5 health.
      */

      player.health += 5;


      /*
        Bonus score.
      */

      score += 100;


      if (
        player.health > 100
      ) {

        player.health = 100;

      }

    }

  }


  /* =====================
     FALL INTO GAP
  ===================== */

  if (
    player.y >
    canvas.height + 100
  ) {

    endGame();

  }


  /* =====================
     HEALTH GAME OVER
  ===================== */

  if (
    player.health <= 0
  ) {

    player.health = 0;

    endGame();

  }

}


/* =========================
   END GAME
========================= */

function endGame() {

  gameOver = true;


  if (score > highScore) {

    highScore =
      Math.floor(score);

    localStorage.setItem(
      "platformerHighScore",
      highScore
    );

  }


  document.getElementById(
    "finalScore"
  ).innerText =
    "Score: " +
    Math.floor(score);


  document.getElementById(
    "finalHighScore"
  ).innerText =
    "High Score: " +
    highScore;


  gameOverScreen.style.display =
    "block";

}


/* =========================
   DRAW
========================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* =====================
     FLOOR
  ===================== */

  ctx.fillStyle = "#444";

  for (let f of floorSegments) {

    ctx.fillRect(

      f.x - player.x + 200,

      f.y,

      f.w,

      f.h

    );

  }


  /* =====================
     PLATFORMS
  ===================== */

  ctx.fillStyle = "#654321";

  for (let p of platforms) {

    ctx.fillRect(

      p.x - player.x + 200,

      p.y,

      p.w,

      p.h

    );

  }


  /* =====================
     ENEMIES
  ===================== */

  ctx.fillStyle = "purple";

  for (let e of enemies) {

    ctx.fillRect(

      e.x - player.x + 200,

      e.y,

      e.w,

      e.h

    );

  }


  /* =====================
     COINS
  ===================== */

  for (let c of coins) {

    if (c.collected) {
      continue;
    }


    ctx.fillStyle = "gold";

    ctx.beginPath();

    ctx.arc(

      c.x - player.x + 200,

      c.y,

      10,

      0,

      Math.PI * 2

    );

    ctx.fill();

  }


  /* =====================
     PLAYER
  ===================== */

  /*
    Normal = red
    Hit = white for 120ms
    then straight back to red.
  */

  if (hitFlash) {

    ctx.fillStyle = "white";

  } else {

    ctx.fillStyle = "red";

  }


  ctx.fillRect(

    200,

    player.y,

    player.w,

    player.h

  );


  /* =====================
     HEALTH BAR BACKGROUND
  ===================== */

  ctx.fillStyle = "#333";

  ctx.fillRect(
    20,
    20,
    204,
    24
  );


  /* =====================
     HEALTH COLOUR
  ===================== */

  if (player.health >= 50) {

    ctx.fillStyle = "green";

  } else if (player.health >= 20) {

    ctx.fillStyle = "orange";

  } else {

    ctx.fillStyle = "red";

  }


  /* =====================
     HEALTH BAR
  ===================== */

  ctx.fillRect(

    22,

    22,

    Math.max(
      0,
      player.health * 2
    ),

    20

  );


  /* =====================
     HEALTH TEXT
  ===================== */

  ctx.fillStyle = "white";

  ctx.font =
    "bold 18px Arial";

  ctx.fillText(

    "Health: " +
    Math.round(player.health) +
    "%",

    20,

    67

  );


  /* =====================
     SCORE
  ===================== */

  ctx.textAlign = "right";

  ctx.font =
    "bold 22px monospace";


  /* HIGH SCORE */

  ctx.fillText(

    "HI " +
    String(highScore)
      .padStart(6, "0"),

    canvas.width - 190,

    35

  );


  /* CURRENT SCORE */

  ctx.fillText(

    String(
      Math.floor(score)
    ).padStart(6, "0"),

    canvas.width - 20,

    35

  );


  /* LEVEL */

  ctx.font =
    "16px Arial";

  ctx.fillText(

    "Level " +
    difficulty,

    canvas.width - 20,

    62

  );


  ctx.textAlign = "left";

}


/* =========================
   GAME LOOP
========================= */

function loop() {

  update();

  draw();

  requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
