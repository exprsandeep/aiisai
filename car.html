<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* GAME STATE */
let gameStarted = false;
let gameOver = false;

/* PLAYER */
let player = {
  x: 100,
  y: 0,
  w: 40,
  h: 60,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 15,
  grounded: false,
  health: 100
};

/* GAME SPEED */
let scrollSpeed = 3;
let speedIncrease = 0.002;

/* GRAVITY */
const gravity = 0.8;

/* WORLD OBJECTS */
let floorSegments = [];
let platforms = [];
let enemies = [];
let coins = [];

/* ENDLESS WORLD */
let nextChunkX = 0;
const chunkWidth = 200;
const generateAhead = 2500;
const deleteBehind = 1000;

/* CREATE A NEW WORLD CHUNK */
function generateChunk(x) {
  const isGap = Math.random() < 0.18;

  if (!isGap) {
    floorSegments.push({
      x: x,
      y: canvas.height - 40,
      w: chunkWidth,
      h: 40
    });
  } else {
    /* PLATFORM OVER THE GAP */
    platforms.push({
      x: x + 20,
      y: canvas.height - 150,
      w: 160,
      h: 20,
      moving: Math.random() < 0.25,
      dir: 1,
      startX: x + 20
    });
  }

  /* RANDOM EXTRA PLATFORM */
  if (Math.random() < 0.35) {
    platforms.push({
      x: x + Math.random() * 80,
      y: canvas.height - (Math.random() * 220 + 120),
      w: 120 + Math.random() * 100,
      h: 20,
      moving: Math.random() < 0.2,
      dir: 1,
      startX: x
    });
  }

  /* RANDOM ENEMY */
  if (Math.random() < 0.35) {
    enemies.push({
      x: x + 80,
      y: canvas.height - 80,
      w: 40,
      h: 40,
      dir: Math.random() < 0.5 ? 1 : -1
    });
  }

  /* RANDOM COIN */
  if (Math.random() < 0.55) {
    coins.push({
      x: x + 100,
      y: canvas.height - (Math.random() * 220 + 100),
      w: 20,
      h: 20,
      collected: false
    });
  }
}

/* GENERATE STARTING WORLD */
for (let i = 0; i < 20; i++) {
  generateChunk(nextChunkX);
  nextChunkX += chunkWidth;
}

/* KEYS */
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* START SCREEN */
document.getElementById("startScreen").style.display = "block";

document.getElementById("playBtn").onclick = () => {
  document.getElementById("startScreen").style.display = "none";
  startCountdown();
};

function startCountdown() {
  let count = 3;
  const cd = document.getElementById("countdown");
  cd.style.display = "block";
  cd.innerText = count;

  let interval = setInterval(() => {
    count--;
    cd.innerText = count;

    if (count === 0) {
      clearInterval(interval);
      cd.style.display = "none";
      gameStarted = true;
    }
  }, 1000);
}

/* RESTART BUTTON */
document.getElementById("restartBtn").onclick = () => {
  location.reload();
};

function update() {
  if (!gameStarted || gameOver) return;

  /* ENDLESS WORLD GENERATION */
  while (nextChunkX < player.x + generateAhead) {
    generateChunk(nextChunkX);
    nextChunkX += chunkWidth;
  }

  /* REMOVE OLD WORLD BEHIND PLAYER */
  floorSegments = floorSegments.filter(
    f => f.x + f.w > player.x - deleteBehind
  );

  platforms = platforms.filter(
    p => p.x + p.w > player.x - deleteBehind
  );

  enemies = enemies.filter(
    e => e.x + e.w > player.x - deleteBehind
  );

  coins = coins.filter(
    c => c.x + c.w > player.x - deleteBehind
  );

  /* AUTO SCROLL */
  scrollSpeed += speedIncrease;
  player.x += scrollSpeed;

  /* MOVEMENT */
  if (keys["ArrowRight"]) {
    player.vx = player.speed;
  } else if (keys["ArrowLeft"]) {
    player.vx = -player.speed;
  } else {
    player.vx = 0;
  }

  /* JUMP */
  if (keys[" "] && player.grounded) {
    player.vy = -player.jumpPower;
    player.grounded = false;
  }

  /* GRAVITY */
  player.vy += gravity;

  /* APPLY VELOCITY */
  player.x += player.vx;
  player.y += player.vy;

  /* FALLING INTO GAP */
  if (player.y > canvas.height) {
    gameOver = true;
    document.getElementById("gameOverScreen").style.display = "block";
  }

  /* FLOOR COLLISION */
  player.grounded = false;

  for (let f of floorSegments) {
    if (
      player.x < f.x + f.w &&
      player.x + player.w > f.x &&
      player.y + player.h > f.y &&
      player.y + player.h < f.y + f.h &&
      player.vy >= 0
    ) {
      player.y = f.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* PLATFORM COLLISION */
  for (let p of platforms) {
    if (p.moving) {
      p.x += p.dir * 2;

      if (p.x < p.startX - 60) {
        p.dir = 1;
      }

      if (p.x > p.startX + 60) {
        p.dir = -1;
      }
    }

    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y + player.h > p.y &&
      player.y + player.h < p.y + p.h &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* ENEMY MOVEMENT + DAMAGE */
  for (let e of enemies) {
    e.x += e.dir * 2;

    if (Math.random() < 0.01) {
      e.dir *= -1;
    }

    if (
      player.x < e.x + e.w &&
      player.x + player.w > e.x &&
      player.y < e.y + e.h &&
      player.y + player.h > e.y
    ) {
      player.health -= 1;
    }
  }

  /* COINS */
  for (let c of coins) {
    if (c.collected) continue;

    if (
      player.x < c.x + c.w &&
      player.x + player.w > c.x &&
      player.y < c.y + c.h &&
      player.y + player.h > c.y
    ) {
      player.health += 5;

      if (player.health > 100) {
        player.health = 100;
      }

      c.collected = true;
    }
  }

  /* GAME OVER BY HEALTH */
  if (player.health <= 0) {
    player.health = 0;
    gameOver = true;
    document.getElementById("gameOverScreen").style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* HEALTH BAR BACKGROUND */
  ctx.fillStyle = "#555";
  ctx.fillRect(20, 20, 200, 20);

  /* HEALTH BAR */
  ctx.fillStyle = "red";
  ctx.fillRect(20, 20, player.health * 2, 20);

  /* HEALTH TEXT */
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText(
    "Health: " + Math.round(player.health) + "%",
    20,
    65
  );

  /* FLOOR */
  ctx.fillStyle = "#444";

  for (let f of floorSegments) {
    ctx.fillRect(
      f.x - player.x + 200,
      f.y,
      f.w,
      f.h
    );
  }

  /* PLATFORMS */
  ctx.fillStyle = "#654321";

  for (let p of platforms) {
    ctx.fillRect(
      p.x - player.x + 200,
      p.y,
      p.w,
      p.h
    );
  }

  /* ENEMIES */
  ctx.fillStyle = "purple";

  for (let e of enemies) {
    ctx.fillRect(
      e.x - player.x + 200,
      e.y,
      e.w,
      e.h
    );
  }

  /* COINS */
  ctx.fillStyle = "gold";

  for (let c of coins) {
    if (c.collected) continue;

    ctx.beginPath();
    ctx.arc(
      c.x - player.x + 200,
      c.y,
      10,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  /* PLAYER */
  ctx.fillStyle = "red";
  ctx.fillRect(
    200,
    player.y,
    player.w,
    player.h
  );
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
