<!DOCTYPE html>
<html>
<head>
  <title>Platformer Survival Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEFA;
      font-family: Arial;
    }

    #startScreen, #gameOverScreen {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    #countdown {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      color: white;
      display: none;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <h1>Platformer Survival</h1>
  <button id="playBtn">Play</button>
</div>

<div id="countdown">3</div>

<div id="gameOverScreen">
  <h1>Game Over</h1>
  <button id="restartBtn">Restart</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* GAME STATE */
let gameStarted = false;
let gameOver = false;

/* PLAYER */
let player = {
  x: 100,
  y: 0,
  w: 40,
  h: 60,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 15,
  grounded: false,
  health: 100
};

/* GAME SPEED */
let scrollSpeed = 3;
let speedIncrease = 0.002;

/* GRAVITY */
const gravity = 0.8;

/* FLOOR WITH GAPS */
let floorSegments = [];
for (let i = 0; i < 50; i++) {
  if (Math.random() < 0.15) continue; // gap
  floorSegments.push({
    x: i * 200,
    y: canvas.height - 40,
    w: 200,
    h: 40
  });
}

/* PLATFORMS (some moving) */
let platforms = [];
for (let i = 0; i < 20; i++) {
  const x = i * 300;
  platforms.push({
    x: x,
    y: canvas.height - (Math.random() * 300 + 100),
    w: 200,
    h: 20,
    moving: Math.random() < 0.3,
    dir: 1,
    startX: x
  });
}

/* ENEMIES (moving) */
let enemies = [];
for (let i = 0; i < 15; i++) {
  enemies.push({
    x: i * 300 + 200,
    y: canvas.height - (Math.random() * 300 + 140),
    w: 40,
    h: 40,
    dir: Math.random() < 0.5 ? 1 : -1
  });
}

/* COINS */
let coins = [];
for (let i = 0; i < 20; i++) {
  coins.push({
    x: i * 300 + 150,
    y: canvas.height - (Math.random() * 300 + 200),
    w: 20,
    h: 20,
    collected: false
  });
}

/* KEYS */
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* START SCREEN */
document.getElementById("startScreen").style.display = "block";

document.getElementById("playBtn").onclick = () => {
  document.getElementById("startScreen").style.display = "none";
  startCountdown();
};

function startCountdown() {
  let count = 3;
  const cd = document.getElementById("countdown");
  cd.style.display = "block";
  cd.innerText = count;

  let interval = setInterval(() => {
    count--;
    cd.innerText = count;
    if (count === 0) {
      clearInterval(interval);
      cd.style.display = "none";
      gameStarted = true;
    }
  }, 1000);
}

/* RESTART BUTTON */
document.getElementById("restartBtn").onclick = () => {
  // Simple full restart
  location.reload();
};

function update() {
  if (!gameStarted || gameOver) return;

  /* AUTO SCROLL */
  scrollSpeed += speedIncrease;
  player.x += scrollSpeed;

  /* MOVEMENT */
  if (keys["ArrowRight"]) player.vx = player.speed;
  else if (keys["ArrowLeft"]) player.vx = -player.speed;
  else player.vx = 0;

  /* JUMP */
  if (keys[" "] && player.grounded) {
    player.vy = -player.jumpPower;
    player.grounded = false;
  }

  /* GRAVITY */
  player.vy += gravity;

  /* APPLY VELOCITY */
  player.x += player.vx;
  player.y += player.vy;

  /* FALLING INTO FLOOR GAPS = GAME OVER */
  if (player.y > canvas.height) {
    gameOver = true;
    document.getElementById("gameOverScreen").style.display = "block";
  }

  /* FLOOR COLLISION */
  player.grounded = false;
  for (let f of floorSegments) {
    if (
      player.x < f.x + f.w &&
      player.x + player.w > f.x &&
      player.y + player.h > f.y &&
      player.y + player.h < f.y + f.h &&
      player.vy >= 0
    ) {
      player.y = f.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* PLATFORM COLLISION + MOVING PLATFORMS */
  for (let p of platforms) {
    if (p.moving) {
      p.x += p.dir * 2;
      if (p.x < p.startX - 50) p.dir = 1;
      if (p.x > p.startX + 50) p.dir = -1;
    }

    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y + player.h > p.y &&
      player.y + player.h < p.y + p.h &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* ENEMY MOVEMENT + DAMAGE */
  for (let e of enemies) {
    e.x += e.dir * 2;
    if (Math.random() < 0.01) e.dir *= -1;

    if (
      player.x < e.x + e.w &&
      player.x + player.w > e.x &&
      player.y < e.y + e.h &&
      player.y + player.h > e.y
    ) {
      player.health -= 1;
    }
  }

  /* COINS (HEAL) */
  for (let c of coins) {
    if (c.collected) continue;

    if (
      player.x < c.x + c.w &&
      player.x + player.w > c.x &&
      player.y < c.y + c.h &&
      player.y + player.h > c.y
    ) {
      player.health += 5; // can go above 100
      c.collected = true;
    }
  }

  /* GAME OVER BY HEALTH */
  if (player.health <= 0) {
    gameOver = true;
    document.getElementById("gameOverScreen").style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* HEALTH BAR */
  ctx.fillStyle = "red";
  ctx.fillRect(20, 20, player.health * 2, 20);

  /* FLOOR */
  ctx.fillStyle = "#444";
  for (let f of floorSegments) {
    ctx.fillRect(f.x - player.x + 200, f.y, f.w, f.h);
  }

  /* PLATFORMS */
  ctx.fillStyle = "#654321";
  for (let p of platforms) {
    ctx.fillRect(p.x - player.x + 200, p.y, p.w, p.h);
  }

  /* ENEMIES */
  ctx.fillStyle = "purple";
  for (let e of enemies) {
    ctx.fillRect(e.x - player.x + 200, e.y, e.w, e.h);
  }

  /* COINS */
  ctx.fillStyle = "gold";
  for (let c of coins) {
    if (c.collected) continue;
    ctx.beginPath();
    ctx.arc(c.x - player.x + 200, c.y, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  /* PLAYER */
  ctx.fillStyle = "red";
  ctx.fillRect(200, player.y, player.w, player.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
